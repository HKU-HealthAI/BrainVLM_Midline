task: who
annotations:
  - /path/to/who-training-annotations.json
image_root: /path/to/training-images
llama_model: /path/to/Llama-3.1-8B-Instruct
biomedclip_pretrained: hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
output_dir: /path/to/output-directory
epochs: 5
batch_size: 8
learning_rate: 0.0001
min_learning_rate: 0.000001
weight_decay: 0.05
warmup_steps: 200
gradient_accumulation_steps: 1
seed: 42
num_workers: 4
use_age: true
upsample_ratio: 0.7
amp: true
initialization_checkpoint: /path/to/BrainVLM-Midline-checkpoint.pth
