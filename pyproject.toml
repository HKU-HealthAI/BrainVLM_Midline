[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midline-agent"
version = "0.1.0"
description = "Research code for a traceable midline glioma decision-support workflow."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
diagnostic = [
  "einops>=0.8,<0.9",
  "numpy>=1.24,<2",
  "omegaconf>=2.3,<2.4",
  "open-clip-torch>=2.24,<2.25",
  "peft>=0.2,<0.3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "torch>=2.1,<2.2",
  "torchvision>=0.16,<0.17",
  "transformers>=4.46,<4.47",
]
survival = ["numpy>=1.24,<2", "torch>=2.1,<2.2", "scikit-learn", "scikit-survival", "pandas", "lifelines"]
treatment = ["openai>=1.54"]
all = [
  "einops>=0.8,<0.9",
  "lifelines",
  "numpy>=1.24,<2",
  "omegaconf>=2.3,<2.4",
  "open-clip-torch>=2.24,<2.25",
  "openai>=1.54",
  "pandas",
  "peft>=0.2,<0.3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "scikit-learn",
  "scikit-survival",
  "torch>=2.1,<2.2",
  "torchvision>=0.16,<0.17",
  "transformers>=4.46,<4.47",
]
dev = ["pytest>=7.4"]

[project.scripts]
midline-extract-features = "scripts.extract_features:main"
midline-train-attention-mil = "scripts.train_attention_mil:main"
midline-train-brainvlm = "scripts.train_brainvlm_midline:main"
midline-predict-tumor = "scripts.predict_tumor:main"
midline-predict-who-grade = "scripts.predict_who_grade:main"
midline-run = "scripts.run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["midline_agent*", "scripts*"]
